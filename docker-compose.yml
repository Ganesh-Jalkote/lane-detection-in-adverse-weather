services:
  lane-detection:
    build:
      context: .
      dockerfile: Dockerfile
    image: lane-detection-adverse-weather:cpu
    container_name: lane-detection
    working_dir: /app
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ./pred_out:/app/pred_out
      - ./models:/app/models
    # Verify that the image's core ML / vision libraries import properly.
    command: ["python", "-c", "import cv2, torch; print('Docker environment ready'); print('PyTorch:', torch.__version__); print('CUDA available:', torch.cuda.is_available()); print('OpenCV:', cv2.__version__)"]
