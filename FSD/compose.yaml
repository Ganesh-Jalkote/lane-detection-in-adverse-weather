services:
  backend:
    build:
      context: ..
      dockerfile: FSD/backend/Dockerfile
    environment:
      MODEL_PATH: /models/best.pt
      MODEL_ENHANCE: auto
      CORS_ORIGINS: http://localhost:8080
      MAX_UPLOAD_MB: 10
    volumes:
      - ../models:/models:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: FSD/frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
